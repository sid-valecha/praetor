[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praetor-cli"
version = "1.2.0"
description = "Local-first closed-loop harness for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sid Valecha" }]
keywords = [
    "ai",
    "agents",
    "coding-agents",
    "claude-code",
    "task-queue",
    "dag",
    "workflow",
    "orchestration",
    "loop-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "mcp>=1.28.0",
    "typer>=0.26.7",
    "pydantic>=2.13.4",
    "python-frontmatter>=1.3.0",
    "rich>=15.0.0",
    "watchdog>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/sid-valecha/praetor"
Repository = "https://github.com/sid-valecha/praetor"
Issues = "https://github.com/sid-valecha/praetor/issues"
Changelog = "https://github.com/sid-valecha/praetor/releases"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[project.scripts]
praetor = "praetor.cli:app"

[tool.setuptools.packages.find]
include = ["praetor*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
