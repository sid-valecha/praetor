[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praetor-cli"
version = "0.0.0"
description = "Local-first task queue and DAG executor for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sid Valecha" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
praetor = "praetor.cli:app"

[tool.setuptools.packages.find]
include = ["praetor*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
